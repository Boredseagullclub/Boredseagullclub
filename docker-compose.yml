Version: '3.8'

services:
  # 🌐 Main API & Socket Server
  api:
    build: .
    command: node backend/app.js
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/seagull?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    restart: always

  # 📥 Confirmation Worker
  confirmation-worker:
    build: .
    command: node backend/workers/confirmationWorker.js
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/seagull?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    restart: always

  # ⚙️ Deposit Worker (Using Change Streams)
  deposit-worker:
    build: .
    command: node backend/workers/depositWorker.js
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/seagull?replicaSet=rs0
    depends_on:
      mongo:
        condition: service_healthy
    restart: always

  # 🍃 MongoDB Core
  mongo:
    image: mongo:latest
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # 🚀 Automated Setup (Runs once then exits)
  mongo-init:
    image: mongo:latest
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongo:27017 --eval 
      'if (!rs.status().ok) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] }) }'

volumes:
  mongo-data:
