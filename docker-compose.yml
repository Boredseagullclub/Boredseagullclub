version: '3.8'

services:
  api:
    build: .
    command: node app.js
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/seagull?replicaSet=rs0&authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - seagull-net

  confirmation-worker:
    build: .
    command: node workers/confirmationWorker.js
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/seagull?replicaSet=rs0&authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - seagull-net

  deposit-worker:
    build: .
    command: node workers/depositWorker.js
    environment:
      - NODE_ENV=production
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/seagull?replicaSet=rs0&authSource=admin
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - seagull-net

  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all", "--auth"]
    # Do NOT expose MongoDB port to the host in production
    # ports:
    #   - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet -u ${MONGO_ROOT_USER} -p ${MONGO_ROOT_PASSWORD} --authenticationDatabase admin
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - seagull-net

  mongo-init:
    image: mongo:8
    depends_on:
      mongo:
        condition: service_healthy
    entrypoint: >
      mongosh --host mongo:27017 -u ${MONGO_ROOT_USER} -p ${MONGO_ROOT_PASSWORD} --authenticationDatabase admin
      --eval 'if (!rs.status().ok) { rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] }) }'
    networks:
      - seagull-net

volumes:
  mongo-data:

networks:
  seagull-net:
    driver: bridge
    # internal: true   # Uncomment this in production for maximum DB isolation
