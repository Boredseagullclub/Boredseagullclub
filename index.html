<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seagull Assets</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?ixlib=rb-4.0.3&auto=format&fit=crop&w=2073&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        /* Dark ocean overlay for text readability */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: rgba(10, 31, 56, 0.65);
            z-index: -1;
        }

        #connectOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #connectOverlay.hidden {
            display: none;
        }

        h1 {
            font-size: 3.2rem;
            margin-bottom: 1.5rem;
            text-shadow: 0 4px 12px rgba(0,0,0,0.8);
        }

        #connectButton {
            background: linear-gradient(90deg, #00d4ff, #0095ff);
            color: white;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.4rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0,212,255,0.5);
            transition: all 0.3s;
        }

        #connectButton:hover {
            transform: scale(1.05);
            box-shadow: 0 12px 40px rgba(0,212,255,0.7);
        }

        #mainContent {
            display: none;
            z-index: 1;
        }

        #mainContent.visible {
            display: block;
        }

        div {
            margin: 1.5rem 0;
        }

        label {
            font-size: 1.4rem;
            margin-right: 1rem;
            min-width: 130px;
            text-align: left;
            display: inline-block;
        }

        select, input[type="number"] {
            padding: 0.9rem 1.3rem;
            font-size: 1.2rem;
            border-radius: 10px;
            border: 1px solid #00d4ff;
            background: rgba(255,255,255,0.15);
            color: white;
            min-width: 240px;
        }

        button#swapButton {
            margin-top: 2.5rem;
            padding: 1.2rem 4rem;
            font-size: 1.5rem;
            background: linear-gradient(90deg, #ff6f61, #ff8c7a);
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255,111,97,0.5);
        }

        #result {
            margin-top: 2.5rem;
            padding: 1.8rem;
            background: rgba(0,0,0,0.5);
            border-radius: 12px;
            min-height: 120px;
            max-width: 700px;
            font-family: monospace;
            color: #d0ffd0;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

    <!-- Wallet Connect Prompt (shows first) -->
    <div id="connectOverlay">
        <h1>Seagull Assets</h1>
        <p style="font-size:1.4rem; margin:1.5rem 0 2.5rem;">Connect your wallet to continue</p>
        <button id="connectButton">Connect Wallet</button>
    </div>

    <!-- Main swap form (hidden until connected) -->
    <div id="mainContent">
        <h1>Seagull Assets Swap</h1>

        <div>
            <label>From Pool:</label>
            <select id="fromPool">
                <option value="xrp_pool">XRP</option>
                <option value="flr_pool">FLR</option>
                <option value="xdc_pool">XDC</option>
            </select>
        </div>

        <div>
            <label>To Pool:</label>
            <select id="toPool">
                <option value="xrp_pool">XRP</option>
                <option value="flr_pool">FLR</option>
                <option value="xdc_pool">XDC</option>
            </select>
        </div>

        <div>
            <label>Amount:</label>
            <input type="number" id="amount" />
        </div>

        <button id="swapButton" onclick="swap()">Swap</button>

        <pre id="result"></pre>
    </div>

    <!-- WalletConnect Modal v2 (CDN - one universal button) -->
    <script type="module">
        import { createAppKit } from 'https://cdn.jsdelivr.net/npm/@reown/appkit@latest/dist/appkit.js';

        const projectId = 'YOUR_PROJECT_ID_HERE';  // ← Replace with real WalletConnect Project ID from https://cloud.walletconnect.com

        const metadata = {
            name: 'Seagull Assets',
            description: 'Multi-chain bridge & swap',
            url: window.location.origin,
            icons: []  // optional
        };

        let modal;
        (async () => {
            modal = await createAppKit({
                projectId,
                metadata,
                features: { analytics: true, email: false, socials: false }
            });

            // Button opens modal
            document.getElementById('connectButton').addEventListener('click', () => {
                modal.open();
            });

            // On successful connect → hide overlay, show form
            modal.subscribeEvents(event => {
                if (event.type === 'connect') {
                    document.getElementById('connectOverlay').classList.add('hidden');
                    document.getElementById('mainContent').classList.add('visible');
                }
            });
        })();
    </script>

    <script>
        function swap() {
            const result = document.getElementById('result');
            result.textContent = 'Wallet connected. Swap requested – processing backend call.';
            // In real version: fetch('/api/swap', ...) here
        }
    </script>

</body>
</html>
