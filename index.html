<!DOCTYPE html>
<html>
<head>
    <title>Seagull Assets</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Seagull Assets Swap</h1>
    <div>
        <label>From Pool:</label>
        <select id="fromPool">
            <option value="xrp_pool">XRP</option>
            <option value="flr_pool">FLR</option>
            <option value="xdc_pool">XDC</option>
        </select>
    </div>
    <div>
        <label>To Pool:</label>
        <select id="toPool">
            <option value="xrp_pool">XRP</option>
            <option value="flr_pool">FLR</option>
            <option value="xdc_pool">XDC</option>
        </select>
    </div>
    <div>
        <label>Amount:</label>
        <input type="number" id="amount" />
    </div>
    <button onclick="swap()">Swap</button>
    <pre id="result"></pre>
    <script src="app.js"></script>
</body>
</html>
